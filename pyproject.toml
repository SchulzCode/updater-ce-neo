[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "innioasis-updater-neo"
version = "3.0"
description = "Cross-platform Innioasis firmware updater: InniUpdaterChin flash engine + online firmware catalog + donations modal"
authors = [
  { name = "Ryan Specter" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.5,<6.12; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
    "requests>=2.31",
    "pyusb>=1.2",
    "pycryptodome>=3.19",
    "pycryptodomex>=3.19",
    "pyserial>=3.5",
    "colorama>=0.4",
    "capstone>=5.0",
    "pyqt-liquidglass>=0.1.0; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.0; sys_platform == 'darwin'",
    "libusb-package>=1.0.30.0; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The oldest interpreter the app ships on.
target-version = "py310"
# The tree was never formatted to a narrow width, so line length is not a gate.
line-length = 120
# ``vendor/mtkclient`` mirrors the shipped Chinese build byte for byte (see
# AGENTS.md) and must never be "cleaned up"; the rest are build output and
# one-off patch scripts rather than source.
extend-exclude = [
    "vendor",
    "build",
    "dist",
    "analysis_cn",
    "debug",
    "_patch_*.py",
]

[tool.ruff.lint]
# Start as a bug gate: syntax errors, broken format/assert usage and undefined
# or misused names, which is what catches a typo that only fires on an error
# path. The tree is green with this set; widen it one rule family at a time
# instead of restyling the whole legacy app in one sweep.
select = ["E9", "F63", "F7", "F82"]
